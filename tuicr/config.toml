diff_view = "side-by-side"
color_words = true
word_diff_regex = '[^[:space:]]'
sidebar_width = 20
leader = " "

[keybindings]
focus_left = ["H"]
focus_right = ["L"]
focus_up = ["K"]
focus_down = ["J"]
toggle_file_list = ["E"]
toggle_single_file_view = ["F"]
file_tree_clear_include = ["Alt-i"]
file_tree_clear_exclude = ["Alt-e"]
toggle_diff_view = ["<leader>d"]
