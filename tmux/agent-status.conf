# Agent status module: shows Claude Code agent state (idle | working |
# blocked | done) in the status bar. Opt in per host by sourcing this file from
# tmux/hosts/<host_short>.conf.
#
# Pieces outside this file, all inert unless $AGENT_STATUS is set:
#   tmux/claude-hooks.json      hooks to merge into ~/.claude/settings.json
#   tmux/scripts/agent-state.sh called by those hooks to tag the pane
#   tmux/sourceme.sh            zsh precmd hook clearing stale tags
#
# Note: re-sourcing tmux.conf does not undo this file. After disabling it on a
# host, restart the tmux server (or unbind a/A and remove the hook by hand).

# Shells (and the agents they start) inside tmux see AGENT_STATUS=1, which
# enables agent-state.sh and the precmd hook. Only affects new panes.
set-environment -g AGENT_STATUS 1

# Agent status (Claude Code hooks call tmux/scripts/agent-state.sh, which sets
# the pane option @agent_state to idle | working | blocked | done).
# @agent_states: the states of a window's panes, skipping panes that dropped
# back to a shell (stale tag). @agent_marker: one marker per window, most
# urgent state wins.
set -g @agent_states '#{P:#{?#{m/r:^-?(zsh|bash|sh|fish|dash)$,#{pane_current_command}},,#{@agent_state}} }'
set -g @agent_marker '#{?#{m:*blocked*,#{E:@agent_states}},#[fg=#{@red}] ●,#{?#{m:*done*,#{E:@agent_states}},#[fg=#{@green}] ✓,#{?#{m:*working*,#{E:@agent_states}},#[fg=#{@peach}] …,}}}'
set -g window-status-format "#I:#W#{E:@agent_marker}#[default]#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#W#{E:@agent_marker}#[default]#{?window_flags,#{window_flags}, }"

# Blocked/working/done/idle counts across all sessions, shown at the start of status-right
# (tmux.conf reserves the #{E:@agent_summary} slot there)
set -g @agent_summary "#($HOME/.dotfiles/tmux/scripts/agent-summary.sh '#{@red}' '#{@peach}' '#{@green}' '#{@overlay0}' '#{@surface1}')"

# "done" means "finished, not looked at yet": clear it once the pane is focused
set-hook -g pane-focus-in 'if -F "#{==:#{@agent_state},done}" "set -p @agent_state idle"'

# Jump to the next blocked (else done) agent in any session; cycles on repeat
bind a run-shell "$HOME/.dotfiles/tmux/scripts/agent-jump.sh"

# Picker over every agent pane in every session
bind A display-popup \
    -T "#[align=centre]Agents" -x C -y C \
    -w 75% \
    -h 75% \
    -E "$HOME/.dotfiles/tmux/scripts/agent-picker.sh"
